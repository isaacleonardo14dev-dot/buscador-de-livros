<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Livros | Open Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>📚 Explorador de Livros</h1>
    <p>Pesquise títulos, autores ou ISBN no acervo da Open Library</p>
  </header>

  <main class="container">
    <!-- Seção de Busca -->
    <section class="busca-box">
      <div class="input-group">
        <input 
          type="text" 
          id="campo-busca" 
          placeholder="Digite o título, autor ou ISBN (ex: Dom Casmurro, Machado de Assis)..."
        />
        <button id="btn-buscar">Buscar</button>
      </div>
    </section>

    <!-- Status e Resultados da API -->
    <div id="status-msg" class="status-msg"></div>
    <section id="resultado" class="cards-grid"></section>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #cbd5e1;">

    <!-- Seção de Favoritos Persistidos no Supabase -->
    <section class="favoritos-box">
      <h2 style="margin-bottom: 16px; color: #1e293b;">⭐ Meus Favoritos Salvos</h2>
      <div id="favoritos" class="cards-grid"></div>
    </section>
  </main>

  <!-- 1. SDK do Supabase CDN (Obrigatório vir antes do script.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. Seu arquivo de script principal -->
  <script src="script.js"></script>
</body>
</html>
